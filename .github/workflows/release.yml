name: release

# A release is a tag: `git tag v0.1.0 && git push origin v0.1.0`.
#
# Two things happen, and both are how a deployment finds out it is behind: the package goes to npm
# (which is what `npx @theintrodb/stremio-skip-addon` resolves and what its `latest` dist-tag answers),
# and a GitHub Release gets the notes. The Docker image is the `image` workflow, which tags the same
# `v*` tags -- one version number, three ways to install it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance: the package is provably built from this commit

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # The tag is the release's identity, and `package.json` is what npm publishes as `latest`.
      # If they disagree the deployment would report the wrong version for ever, so this is a stop.
      - name: the tag and the manifest agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $pkg"
            exit 1
          fi
          echo "releasing $pkg"
      # The same gate `main` gets: a broken build must not reach `latest`.
      - run: npm run check
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notes:
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
