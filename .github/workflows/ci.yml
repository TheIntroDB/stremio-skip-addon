name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # test/cut.test.ts generates a video and cuts it for real, so the runner
      # needs ffmpeg. The published image gets it from Debian (see Dockerfile).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Proves the service compiles to dist/ the way the image runs it.
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Proves the image builds and that ffmpeg is in it.
      - run: docker build -t tidb-stremio-skip:ci .
      - run: docker run --rm tidb-stremio-skip:ci ffmpeg -version
