# TheIntroDB Stremio addon, for a stack you run yourself.
#
#   cp .env.example .env      # then put your TheIntroDB API key in it
#   docker compose up -d
#
# It builds the image in this directory (skipping the build with `--pull`-style runs
# is fine: `docker compose up -d` uses ghcr.io/theintrodb/stremio-skip-addon:latest
# when you comment out `build:`).
services:
  tidb-skip:
    image: ghcr.io/theintrodb/stremio-skip-addon:latest
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Required: lookups without a key are rate limited per IP. Compose reads the
      # .env file next to this one, so `cp .env.example .env` is the whole setup.
      TIDB_API_KEY: ${TIDB_API_KEY:?set TIDB_API_KEY}
      # blocking  wait for the first segment (a couple of seconds), so the intro is
      #           gone from the very first play
      # on        play the source immediately and cut from the next playback
      # off       splice HLS playlists only: no video copied, no disk use
      CUTS: ${CUTS:-blocking}
      # Seconds left alone at each end of every window (see .env.example).
      SKIP_MARGIN_SECONDS: ${SKIP_MARGIN_SECONDS:-2}
      # Seconds of the episode that must be ready before playback starts (see .env.example).
      PREROLL_SECONDS: ${PREROLL_SECONDS:-10}
      # Relay every stream through this service (see .env.example): debrid links need it.
      PROXY: ${PROXY:-on}
      CACHE_MAX_GB: ${CACHE_MAX_GB:-50}
      PRECUT_SOURCES: ${PRECUT_SOURCES:-2}
      CUT_CONCURRENCY: ${CUT_CONCURRENCY:-2}
      TZ: ${TZ:-UTC}
    volumes:
      # Keep the segment cache out of the container: it is the only state there is, and
      # without this every recreate starts cutting from scratch.
      - cut-cache:/cache

volumes:
  cut-cache:
